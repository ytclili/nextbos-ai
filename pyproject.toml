  [project]
  name = "nextbos-ai"
  version = "0.1.0"
  description = "LangGraph + FastAPI agent runtime with Redis short-term state and PostgreSQL long-term memory."
  requires-python = ">=3.11"
  dependencies = [
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.52.3,<1",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "langchain-core>=1.5.6,<2",
    "langchain-openai>=1.1.5,<2",
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-redis>=0.5.1,<1",
  "redis>=7.4.1,<8",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "asyncpg>=0.31.0,<1",
    "alembic>=1.19.1,<2",
    "httpx>=0.28.1,<1",
  ]

  [dependency-groups]
  dev = [
    "langgraph-cli[inmem]>=0.4.31,<0.5",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.3,<1",
  ]

  [build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"

  [tool.hatch.build.targets.wheel]
  packages = ["src/app"]

  [tool.pytest.ini_options]
  pythonpath = ["src"]
  asyncio_mode = "auto"

  [tool.ruff]
  line-length = 100
  target-version = "py311"

  [tool.ruff.lint]
  select = ["E", "F", "I", "B", "UP"]
