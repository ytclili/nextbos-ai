name: users
table_reference:
  catalog: ""
  schema: public
  table: users
columns:
  - name: id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: true
    properties:
      description: WMS/后台用户主键，业务代理创建人、更新人等字段会引用该 ID。
  - name: tenant_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 租户 ID，引用 tenants.id，用于多租户隔离。
  - name: email
    type: TEXT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 后台用户登录邮箱，全局唯一索引 idx_users_email_unique。
  - name: password_hash
    type: TEXT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 后台用户密码哈希，保存 bcrypt hash，不应返回给前端或写入日志。
  - name: role
    type: TEXT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 后台用户角色；建表约束为 admin、user，当前部分管理接口代码也识别 superadmin。
  - name: status
    type: TEXT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 后台用户状态，可选 active、disabled。
  - name: created_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 用户创建时间。
  - name: updated_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 用户最后更新时间。
primary_key: id
cached: false
properties:
  description: 后台认证用户表，小程序业务代理等 WMS 管理动作通过该表记录操作人。
