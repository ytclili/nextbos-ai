name: wms_warehouse_locations
table_reference:
  catalog: ""
  schema: public
  table: wms_warehouse_locations
columns:
  - name: id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: true
    properties:
      description: WMS 库位主键，出库单明细计划库位、实际库位和拣货库位会引用该字段。
  - name: tenant_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 租户 ID，用于多租户隔离。
  - name: warehouse_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 所属仓库 ID，引用 wms_warehouses.id。
  - name: zone_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 所属库区 ID，引用 wms_warehouse_zones.id。
  - name: code
    type: VARCHAR(50)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 库位编码，同一仓库内按 upper(code) 唯一，编码不允许更新。
  - name: name
    type: VARCHAR(200)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 库位名称。
  - name: description
    type: VARCHAR(200)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 库位描述。
  - name: location_type_code
    type: VARCHAR(32)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 库位类型编码，例如 PALLET_1、PALLET_2、BULK。
  - name: product_category_code
    type: VARCHAR(64)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 库位适用商品分类编码。
  - name: barcode
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 库位条码，非空时租户内按 upper(barcode) 唯一。
  - name: aisle_no
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 巷道号。
  - name: row_no
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 排号。
  - name: column_no
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 列号。
  - name: level_no
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 层号。
  - name: putaway_sequence
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 上架顺序。
  - name: picking_sequence
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 拣选顺序。
  - name: is_locked
    type: BOOLEAN
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 是否锁定库位。
  - name: lock_reason_code
    type: VARCHAR(64)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 库位锁定原因编码；未锁定时应为空。
  - name: quick_flag
    type: BOOLEAN
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 是否快捷库位。
  - name: allocation_locked
    type: BOOLEAN
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 是否锁定分配。
  - name: allow_multi_product
    type: BOOLEAN
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 是否允许多商品共库位。
  - name: allow_overload
    type: BOOLEAN
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 是否允许超载。
  - name: allow_multi_batch
    type: BOOLEAN
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 是否允许多批次共库位。
  - name: status
    type: VARCHAR(16)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 库位状态，可选 active、inactive。
  - name: version
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 并发更新版本号。
  - name: created_by
    type: BIGINT
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 创建库位的后台用户 ID。
  - name: updated_by
    type: BIGINT
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 最后更新库位的后台用户 ID。
  - name: created_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 库位创建时间。
  - name: updated_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 库位最后更新时间。
primary_key: id
cached: false
properties:
  description: WMS 库位主档表，出库拣货、计划库位、实际库位和库存位置相关功能引用该表。
