name: shop_user_customer_bindings
table_reference:
  catalog: ""
  schema: public
  table: shop_user_customer_bindings
columns:
  - name: id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: true
    properties:
      description: 用户客户绑定主键。
  - name: tenant_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 租户 ID。
  - name: shop_user_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: Shop 用户 ID，引用 shop_users.id。
  - name: wms_customer_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 绑定的 WMS 客户 ID，引用 wms_customers.id。
  - name: status
    type: VARCHAR(16)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 绑定状态，可选 active、disabled。
  - name: is_default
    type: BOOLEAN
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 是否默认绑定；当前小程序按默认有效绑定解析 WMS 客户。
  - name: created_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 绑定创建时间。
  - name: updated_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 绑定最后更新时间。
primary_key: id
cached: false
properties:
  description: Shop 用户与 WMS 客户绑定表，小程序下单时通过该表确定 customer_id。
