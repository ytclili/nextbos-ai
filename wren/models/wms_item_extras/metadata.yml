name: wms_item_extras
table_reference:
  catalog: ""
  schema: public
  table: wms_item_extras
columns:
  - name: id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: true
    properties:
      description: 商品扩展信息主键。
  - name: tenant_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 租户 ID。
  - name: item_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 商品货品 ID，引用 wms_items.id。
  - name: product_intro
    type: VARCHAR(2000)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 商品介绍文案。
  - name: image_url
    type: VARCHAR(1000)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 商品图片 URL，来自 WMS 图片上传接口返回的 OSS 地址，小程序商品图使用该字段。
  - name: bom_flag
    type: BOOLEAN
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 是否 BOM 商品。
  - name: assembly_flag
    type: BOOLEAN
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 是否组合装配商品。
  - name: origin_place
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 原产地。
  - name: hs_code
    type: VARCHAR(64)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 海关编码。
  - name: currency_unit
    type: VARCHAR(40)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 币种单位。
  - name: manufacturer
    type: VARCHAR(200)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 生产厂家。
  - name: short_code
    type: VARCHAR(50)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 商品简码。
  - name: remark1
    type: VARCHAR(500)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 扩展备注 1。
  - name: remark2
    type: VARCHAR(500)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 扩展备注 2。
  - name: created_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 扩展信息创建时间。
  - name: updated_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 扩展信息最后更新时间。
primary_key: id
cached: false
properties:
  description: WMS 商品扩展表，小程序主要使用 image_url 展示商品图片。
