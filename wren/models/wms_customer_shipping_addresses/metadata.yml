name: wms_customer_shipping_addresses
table_reference:
  catalog: ""
  schema: public
  table: wms_customer_shipping_addresses
columns:
  - name: id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: true
    properties:
      description: WMS 客户收发货地址主键。
  - name: tenant_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 租户 ID，引用 tenants.id，用于多租户隔离。
  - name: customer_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 地址所属 WMS 客户 ID，引用 wms_customers.id。
  - name: code
    type: VARCHAR(50)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 地址编码，租户内按 upper(code) 唯一，编码不允许更新。
  - name: address_code
    type: VARCHAR(50)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 外部地址编码或业务地址编码。
  - name: description
    type: VARCHAR(200)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 地址描述。
  - name: company_name
    type: VARCHAR(200)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 地址对应公司名称。
  - name: province
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 省份。
  - name: city
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 城市。
  - name: district
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 区县。
  - name: postal_code
    type: VARCHAR(20)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 邮政编码。
  - name: address_detail
    type: VARCHAR(500)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 详细地址。
  - name: address_line3
    type: VARCHAR(500)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 地址补充行 3。
  - name: address_line4
    type: VARCHAR(500)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 地址补充行 4。
  - name: route_code
    type: VARCHAR(50)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 配送路线编码。
  - name: route_order
    type: INTEGER
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 配送路线顺序。
  - name: owner_company_code
    type: VARCHAR(50)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 货主公司编码。
  - name: remark1
    type: VARCHAR(500)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 地址备注 1。
  - name: remark2
    type: VARCHAR(500)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 地址备注 2。
  - name: version
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 并发更新版本号。
  - name: created_by
    type: BIGINT
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 创建地址的后台用户 ID。
  - name: updated_by
    type: BIGINT
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 最后更新地址的后台用户 ID。
  - name: created_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 地址创建时间。
  - name: updated_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 地址最后更新时间。
primary_key: id
cached: false
properties:
  description: WMS 客户收发货地址主档表，出库单配送信息可引用该表；小程序自有地址另存于 shop_user_addresses。
