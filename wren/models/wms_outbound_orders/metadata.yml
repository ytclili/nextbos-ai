name: wms_outbound_orders
table_reference:
  catalog: ""
  schema: public
  table: wms_outbound_orders
columns:
  - name: id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: true
    properties:
      description: WMS 出库单主键，小程序订单 ID 对应该字段。
  - name: tenant_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 租户 ID。
  - name: outbound_no
    type: VARCHAR(50)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 出库单号，小程序订单号展示使用该字段。
  - name: outbound_type
    type: wms_outbound_order_type
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 出库单类型；小程序下单创建 wechat 类型。
  - name: outbound_status
    type: wms_outbound_order_status
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 出库单状态，也是小程序订单状态来源。
  - name: order_date
    type: DATE
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 下单日期。
  - name: document_date
    type: DATE
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 单据日期。
  - name: expected_date
    type: DATE
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 期望出库或配送日期。
  - name: ship_date
    type: DATE
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 发货日期。
  - name: warehouse_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 出库仓库 ID。
  - name: owner_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 货主客户 ID；小程序下单时服务端解析 WMS 客户并写入。
  - name: customer_id
    type: BIGINT
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 收货客户 ID；小程序下单时通常与 owner_id 同源。
  - name: customer_reference
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 客户参考号；小程序订单兼容写入 SHOP-USER-{id}。
  - name: sales_order_no
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 销售订单号。
  - name: warehouse_entry_no
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 仓库入库关联单号。
  - name: priority
    type: wms_outbound_priority
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 出库优先级。
  - name: cross_dock_flag
    type: wms_outbound_cross_dock_flag
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 越库标记。
  - name: remark
    type: VARCHAR(1000)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 订单备注，小程序下单 remark 写入该字段。
  - name: version
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 并发更新版本号。
  - name: created_by
    type: BIGINT
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 创建人用户 ID。
  - name: updated_by
    type: BIGINT
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 最后更新人用户 ID。
  - name: audited_by
    type: BIGINT
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 审核人用户 ID。
  - name: created_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 出库单创建时间。
  - name: updated_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 出库单最后更新时间。
  - name: audited_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 审核时间。
  - name: shipped_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 出库完成时间。
primary_key: id
cached: false
properties:
  description: WMS 出库单头表，小程序订单创建后落在该表，outbound_type 为 wechat。
