name: wms_item_inventory_policies
table_reference:
  catalog: ""
  schema: public
  table: wms_item_inventory_policies
columns:
  - name: id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: true
    properties:
      description: 商品库存策略主键。
  - name: tenant_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 租户 ID。
  - name: item_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 商品货品 ID，引用 wms_items.id。
  - name: price
    type: NUMERIC(18,6)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 商品价格，小程序商品售价和订单行单价来自该字段。
  - name: cost
    type: NUMERIC(18,6)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 商品成本。
  - name: available_inventory
    type: NUMERIC(18,6)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 可用库存，小程序商品库存和购物车预占校验使用该字段。
  - name: inventory_allocation
    type: NUMERIC(18,6)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 库存分配数量。
  - name: inventory_order_lower_limit
    type: NUMERIC(18,6)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 库存订货下限。
  - name: inventory_order_qty
    type: NUMERIC(18,6)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 建议订货数量。
  - name: abc_level
    type: VARCHAR(10)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: ABC 分类等级。
  - name: standard_order_cost
    type: NUMERIC(18,6)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 标准订货成本。
  - name: transport_cost
    type: NUMERIC(18,6)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 运输成本。
  - name: created_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 库存策略创建时间。
  - name: updated_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 库存策略最后更新时间。
primary_key: id
cached: false
properties:
  description: WMS 商品库存和价格策略表，小程序商品价格、库存展示和购物车库存校验依赖该表。
