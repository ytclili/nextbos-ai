name: wms_warehouses
table_reference:
  catalog: ""
  schema: public
  table: wms_warehouses
columns:
  - name: id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: true
    properties:
      description: WMS 仓库主键，小程序下单时服务端选择默认 active 仓库写入出库单。
  - name: tenant_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 租户 ID，用于多租户隔离。
  - name: code
    type: VARCHAR(50)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 仓库编码，租户内按 upper(code) 唯一，编码不允许更新。
  - name: name
    type: VARCHAR(200)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 仓库名称。
  - name: short_name
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 仓库简称。
  - name: warehouse_type_code
    type: VARCHAR(32)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 仓库类型编码，默认 STANDARD。
  - name: company_code
    type: VARCHAR(50)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 公司编码，默认 SDB。
  - name: department_code
    type: VARCHAR(50)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 部门编码，默认 SDB。
  - name: province_code
    type: VARCHAR(32)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 省份编码。
  - name: province_name
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 省份名称。
  - name: city_code
    type: VARCHAR(32)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 城市编码。
  - name: city_name
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 城市名称。
  - name: postal_code
    type: VARCHAR(20)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 邮政编码。
  - name: status
    type: VARCHAR(16)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 仓库状态，可选 active、inactive；小程序下单只选择 active 仓库。
  - name: version
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 并发更新版本号。
  - name: created_by
    type: BIGINT
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 创建仓库的后台用户 ID。
  - name: updated_by
    type: BIGINT
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 最后更新仓库的后台用户 ID。
  - name: created_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 仓库创建时间。
  - name: updated_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 仓库最后更新时间。
primary_key: id
cached: false
properties:
  description: WMS 仓库主档表，小程序订单创建时用于确定出库仓库。
