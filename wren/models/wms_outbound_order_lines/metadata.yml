name: wms_outbound_order_lines
table_reference:
  catalog: ""
  schema: public
  table: wms_outbound_order_lines
columns:
  - name: id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: true
    properties:
      description: 出库单明细主键。
  - name: tenant_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 租户 ID。
  - name: outbound_order_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 出库单 ID，引用 wms_outbound_orders.id。
  - name: line_no
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 订单明细行号。
  - name: item_id
    type: BIGINT
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 商品货品 ID，引用 wms_items.id。
  - name: item_code_snapshot
    type: VARCHAR(100)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 下单时商品编码快照。
  - name: item_name_snapshot
    type: VARCHAR(200)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 下单时商品名称快照。
  - name: uom
    type: VARCHAR(40)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 商品单位快照。
  - name: goods_status
    type: wms_goods_status
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 商品库存状态。
  - name: ordered_quantity
    type: NUMERIC(18,3)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 下单数量。
  - name: confirmed_quantity
    type: NUMERIC(18,3)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 确认数量。
  - name: unit_price
    type: NUMERIC(18,6)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 下单时商品单价快照，来自 wms_item_inventory_policies.price。
  - name: amount
    type: NUMERIC(18,6)
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 明细金额，等于数量乘单价。
  - name: remark
    type: VARCHAR(1000)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 明细备注。
  - name: batch_no
    type: VARCHAR(100)
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 批次号。
  - name: production_date
    type: DATE
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 生产日期。
  - name: expiry_date
    type: DATE
    is_calculated: false
    not_null: false
    is_primary_key: false
    properties:
      description: 到期日期。
  - name: created_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 明细创建时间。
  - name: updated_at
    type: TIMESTAMPTZ
    is_calculated: false
    not_null: true
    is_primary_key: false
    properties:
      description: 明细最后更新时间。
primary_key: id
cached: false
properties:
  description: WMS 出库单明细表，小程序订单商品明细落在该表。
