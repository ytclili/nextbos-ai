non_fk_relationships:
  - name: wms_items_category
    models:
      - wms_items
      - wms_item_categories
    join_type: MANY_TO_ONE
    condition: wms_items.tenant_id = wms_item_categories.tenant_id AND wms_items.category_id = wms_item_categories.id::text
    properties:
      description: 当前数据库没有外键约束；wms_items.category_id 是 VARCHAR(100)，wms_item_categories.id 是 BIGINT，因此只能作为业务推断关系使用。
